<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#151714">
<style>[hidden]{display:none!important} html,body{margin:0;min-height:100%} :root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Zebra Mkt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap">
<style>
/* Layout: barra lateral fija en escritorio, pestañas arriba en el celu; tarjetas blancas sobre gris casi blanco, como App Calle */
:root {
  --bg: #f3f4f2;
  --surface: #ffffff;
  --surface-2: #f7f8f6;
  --line: #e2e4df;
  --fg: #151714;
  --muted: #6b7068;
  --ink: #151714;          /* botones principales */
  --ink-fg: #ffffff;
  --ok: #1f8a4c;  --ok-bg: #e5f4ea;
  --warn: #a86300; --warn-bg: #fbf0dc;
  --bad: #c2362b; --bad-bg: #fbe7e5;
  --info: #2b5fd9; --info-bg: #e7eefc;
  --b-zebra: #151714; --b-kosmos: #7a4fd6; --b-before: #e0661f; --b-beach: #11928a;
  --shadow: 0 1px 2px rgba(20, 23, 20, .06), 0 4px 16px rgba(20, 23, 20, .06);
  --font: "Onest", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 14px; --r-sm: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121412; --surface: #1b1e1b; --surface-2: #222622; --line: #2e332e; --fg: #eef0ec; --muted: #9aa097;
  --ink: #eef0ec; --ink-fg: #121412;
  --ok: #5cc98a; --ok-bg: #1d3326; --warn: #e6a64a; --warn-bg: #3a2c15; --bad: #f07a6f; --bad-bg: #3d1f1c; --info: #8eaefc; --info-bg: #1d2740;
  --b-zebra: #eef0ec; --b-kosmos: #a98af0; --b-before: #f2925a; --b-beach: #4cc7bd;
  --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121412; --surface: #1b1e1b; --surface-2: #222622; --line: #2e332e; --fg: #eef0ec; --muted: #9aa097;
  --ink: #eef0ec; --ink-fg: #121412;
  --ok: #5cc98a; --ok-bg: #1d3326; --warn: #e6a64a; --warn-bg: #3a2c15; --bad: #f07a6f; --bad-bg: #3d1f1c; --info: #8eaefc; --info-bg: #1d2740;
  --b-zebra: #eef0ec; --b-kosmos: #a98af0; --b-before: #f2925a; --b-beach: #4cc7bd;
  --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px; line-height: 1.45; font-variant-numeric: tabular-nums; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--info); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }

.app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100%; }
.side { position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; height: 100vh; display: flex; flex-direction: column; gap: 18px; padding: 20px 14px 20px max(16px, env(safe-area-inset-left, 0px)); border-right: 1px solid var(--line); background: var(--surface); }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 6px; }
.brand-mark { width: 30px; height: 30px; border-radius: 9px; background: repeating-linear-gradient(-45deg, var(--ink) 0 5px, var(--surface) 5px 9px); border: 1.5px solid var(--ink); flex: none; }
.brand b { font-size: 16px; font-weight: 700; letter-spacing: -.01em; }
.brand small { display: block; color: var(--muted); font-size: 11px; }
.nav { display: grid; gap: 2px; }
.nav button { display: flex; align-items: center; justify-content: space-between; gap: 8px; text-align: left; border: 0; background: none; padding: 9px 10px; border-radius: var(--r-sm); font-weight: 500; color: var(--muted); }
.nav button:hover { background: var(--surface-2); color: var(--fg); }
.nav button[aria-current="page"] { background: var(--ink); color: var(--ink-fg); }
.nav .count { font-size: 11px; font-weight: 600; min-width: 20px; padding: 1px 6px; border-radius: 999px; background: var(--bad-bg); color: var(--bad); text-align: center; }
.nav button[aria-current="page"] .count { background: var(--ink-fg); color: var(--ink); }
.who { margin-top: auto; display: grid; gap: 6px; padding: 12px; border-radius: var(--r-sm); background: var(--surface-2); border: 1px dashed var(--line); }
.who label { font-size: 11px; color: var(--muted); }
.who select { width: 100%; padding: 7px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); }
.who p { margin: 0; font-size: 11px; color: var(--muted); }

.main { min-width: 0; padding-block: 22px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.main-inner { max-width: 1180px; margin-inline: auto; display: grid; gap: 18px; }
.topbar { display: none; }
.pagehead { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
.pagehead h1 { font-size: 24px; font-weight: 700; letter-spacing: -.02em; }
.pagehead p { margin: 2px 0 0; color: var(--muted); }
.proto { font-size: 12px; color: var(--warn); background: var(--warn-bg); padding: 8px 12px; border-radius: var(--r-sm); }

.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 999px; font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--ink); color: var(--ink-fg); border-color: var(--ink); }
.btn.small { padding: 5px 10px; font-size: 12px; }
.btn.danger { color: var(--bad); border-color: var(--bad); background: var(--surface); }
.btn.danger.armed { background: var(--bad); color: #fff; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 5px 11px; border-radius: 999px; font-size: 12px; font-weight: 500; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--ink-fg); border-color: var(--ink); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
select.chip { padding-right: 8px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.card h2 { font-size: 15px; font-weight: 600; }
.card .note { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
.grid2 { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); }
.stats { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.stat b { display: block; font-size: 24px; font-weight: 700; letter-spacing: -.02em; }
.stat span { font-size: 12px; color: var(--muted); }
.stat.bad b { color: var(--bad); }

.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; white-space: nowrap; }
.st-pedido { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.st-proceso { background: var(--info-bg); color: var(--info); }
.st-revision { background: var(--warn-bg); color: var(--warn); }
.st-aprobado { background: var(--ok-bg); color: var(--ok); }
.st-publicado { background: var(--ink); color: var(--ink-fg); }
.p-ok { background: var(--ok-bg); color: var(--ok); }
.p-warn { background: var(--warn-bg); color: var(--warn); }
.p-bad { background: var(--bad-bg); color: var(--bad); }
.p-muted { background: var(--surface-2); color: var(--muted); }

/* tarjeta de tarea */
.task { display: grid; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 12px; text-align: left; width: 100%; position: relative; overflow: hidden; }
.task::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--bcol, var(--line)); }
.task:hover { border-color: var(--muted); }
.task-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.task-title { font-weight: 600; line-height: 1.3; }
.task-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 12px; color: var(--muted); }
.task-meta .late { color: var(--bad); font-weight: 600; }
.task-meta .soon { color: var(--warn); font-weight: 600; }
.task-actions { display: flex; flex-wrap: wrap; gap: 6px; }
.av { width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 10px; font-weight: 700; background: var(--surface-2); border: 1px solid var(--line); flex: none; }
.av.free { border-style: dashed; }

.group { display: grid; gap: 8px; }
.group > h3 { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.group > h3 .n { font-weight: 500; }
.group.late > h3 { color: var(--bad); }
.list { display: grid; gap: 8px; }
.empty { padding: 18px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--r-sm); font-size: 13px; }

/* tablero */
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(250px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 6px; }
.col { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; display: grid; gap: 8px; align-content: start; min-height: 200px; }
.col-h { display: flex; align-items: center; justify-content: space-between; padding: 2px 2px 4px; }
.col-h span { font-size: 12px; color: var(--muted); font-weight: 600; }

/* calendario */
.cal-wrap { overflow-x: auto; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(110px, 1fr)); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--surface); min-width: 770px; }
.cal .dow { padding: 8px; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; background: var(--surface-2); border-bottom: 1px solid var(--line); }
.cal .day { min-height: 104px; padding: 6px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); display: grid; align-content: start; gap: 4px; }
.cal .day:nth-child(7n) { border-right: 0; }
.cal .day.clickable { cursor: pointer; }
.cal .day.clickable:hover { background: var(--surface-2); }
.cal .day.out { background: var(--surface-2); color: var(--muted); }
.cal .num { font-size: 12px; font-weight: 600; }
.cal .today .num { background: var(--ink); color: var(--ink-fg); border-radius: 6px; padding: 0 6px; justify-self: start; }
.ev { font-size: 11px; line-height: 1.25; padding: 3px 6px; border-radius: 6px; background: var(--surface-2); border-left: 3px solid var(--bcol, var(--line)); text-align: left; border-top: 0; border-right: 0; border-bottom: 0; width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ev.fecha { background: var(--info-bg); color: var(--info); font-weight: 600; }
.ev.late { color: var(--bad); }
.agenda { display: none; }

/* barras */
.bars { display: grid; gap: 12px; }
.barrow { display: grid; grid-template-columns: minmax(90px, 140px) minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.barrow .lbl { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.track { position: relative; height: 12px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.track .est { position: absolute; inset: 0 auto 0 0; background: var(--line); border-radius: 999px; }
.track .real { position: absolute; left: 0; top: 3px; bottom: 3px; border-radius: 999px; background: var(--ink); }
.track .real.over { background: var(--bad); }
.barrow .val { font-size: 12px; color: var(--muted); white-space: nowrap; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 18px; height: 8px; border-radius: 4px; margin-right: 6px; vertical-align: middle; }

/* pauta */
.camp { display: grid; gap: 12px; }
.camp-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: flex-start; }
.camp-head h2 { font-size: 16px; }
.camp-sub { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 2px; }
.budget { display: grid; gap: 4px; }
.budget .track { height: 8px; }
.budget .track .real { top: 0; bottom: 0; }
.budget small { color: var(--muted); font-size: 12px; }
.metrics { width: 100%; border-collapse: collapse; font-size: 13px; }
.metrics th, .metrics td { padding: 7px 6px; border-bottom: 1px solid var(--line); text-align: left; }
.metrics th { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.metrics td.n, .metrics th.n { text-align: right; }
.metrics input { width: 90px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); text-align: right; }
.addmetric { display: flex; flex-wrap: wrap; gap: 6px; }
.addmetric input { padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); min-width: 0; flex: 1 1 140px; }

/* equipo */
.people { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); }
.person { display: grid; gap: 8px; }
.person-h { display: flex; gap: 10px; align-items: center; }
.person-h .av { width: 36px; height: 36px; font-size: 13px; }
.person-h b { display: block; }
.person-h small { color: var(--muted); font-size: 12px; }
.kv { display: flex; flex-wrap: wrap; gap: 6px; }
.table-wrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 520px; }
.tbl th, .tbl td { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: left; }
.tbl th { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.tbl td.n, .tbl th.n { text-align: right; }

/* modal */
.scrim { position: fixed; inset: 0; background: rgba(10, 12, 10, .45); display: grid; place-items: center; padding: 16px; z-index: 50; }
.sheet { width: min(560px, 100%); max-height: calc(100% - 32px); overflow: auto; background: var(--surface); border-radius: 18px; padding: 20px; display: grid; gap: 14px; box-shadow: var(--shadow); }
.sheet h2 { font-size: 18px; }
.form { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
.form .full { grid-column: 1 / -1; }
.field { display: grid; gap: 4px; min-width: 0; }
.field label { font-size: 12px; color: var(--muted); font-weight: 500; }
.field input, .field select, .field textarea { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); }
.field textarea { min-height: 80px; resize: vertical; }
.field input[readonly], .field select[disabled], .field textarea[readonly] { background: var(--surface-2); color: var(--muted); }
.sheet-foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: center; }
.sheet-foot .right { display: flex; gap: 8px; margin-left: auto; }
.warnbox { font-size: 12px; color: var(--bad); background: var(--bad-bg); padding: 8px 10px; border-radius: 8px; }
.link-out { font-size: 12px; word-break: break-all; }
.thumbs { display: flex; flex-wrap: wrap; gap: 8px; }
.thumb { position: relative; width: 72px; height: 72px; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: var(--surface-2); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb button { position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; border-radius: 50%; border: 0; background: rgba(0,0,0,.6); color: #fff; font-size: 12px; line-height: 20px; padding: 0; }
.attach { display: inline-flex; align-items: center; justify-content: center; width: 72px; height: 72px; border-radius: 10px; border: 1px dashed var(--muted); color: var(--muted); font-size: 12px; text-align: center; cursor: pointer; }
.attach input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.refs { display: grid; gap: 4px; }
.refs a { font-size: 12px; word-break: break-all; color: var(--info); }
.devol { border-left: 3px solid var(--warn); background: var(--warn-bg); color: var(--fg); padding: 8px 10px; border-radius: 8px; font-size: 12px; display: grid; gap: 2px; }
.devol b { color: var(--warn); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
.hist { display: grid; gap: 8px; }
.toggles { display: flex; flex-wrap: wrap; gap: 6px; }
.toggles button { border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 500; color: var(--muted); }
.toggles button[aria-pressed="true"] { background: var(--ink); color: var(--ink-fg); border-color: var(--ink); }
.toggles button[disabled] { cursor: default; }
.ev.pub { background: var(--ok-bg); color: var(--ok); font-weight: 600; }
.gate { position: fixed; inset: 0; z-index: 80; background: var(--bg); display: grid; place-items: center; padding: 24px; }
.gate-box { display: grid; gap: 14px; justify-items: center; text-align: center; max-width: 340px; }
.gate-box .brand-mark { width: 48px; height: 48px; border-radius: 14px; }
.gate-box h1 { font-size: 26px; font-weight: 700; letter-spacing: -.02em; }
.gate-box p { margin: 0; color: var(--muted); }
.me { margin-top: auto; display: grid; gap: 8px; padding: 12px; border-radius: var(--r-sm); background: var(--surface-2); border: 1px solid var(--line); }
.me b { display: block; } .me small { color: var(--muted); font-size: 11px; word-break: break-all; }
.sync { font-size: 11px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); display: inline-block; }
.sync.off i { background: var(--warn); }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--ink-fg); padding: 10px 16px; border-radius: 999px; font-weight: 500; z-index: 60; box-shadow: var(--shadow); }

@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .topbar { display: grid; gap: 10px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); padding-block: 10px 8px; margin-top: -22px; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
  .topbar-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .topbar .who-mini select { padding: 6px 8px; border-radius: 999px; border: 1px dashed var(--line); background: var(--surface); font-size: 12px; max-width: 170px; }
  .tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button { flex: none; border: 1px solid var(--line); background: var(--surface); padding: 7px 12px; border-radius: 999px; font-weight: 500; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
  .tabs button[aria-current="page"] { background: var(--ink); color: var(--ink-fg); border-color: var(--ink); }
  .tabs .count { font-size: 10px; font-weight: 700; padding: 0 5px; border-radius: 999px; background: var(--bad-bg); color: var(--bad); }
  .pagehead h1 { font-size: 20px; }
  .cal-wrap { display: none; }
  .agenda { display: grid; gap: 12px; }
  .form { grid-template-columns: 1fr; }
  .scrim { align-items: end; padding: 0; }
  .sheet { width: 100%; border-radius: 18px 18px 0 0; max-height: 92%; padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px)); }
}
@media (prefers-reduced-motion: no-preference) {
  .toast { animation: up .2s ease-out; }
  @keyframes up { from { transform: translate(-50%, 8px); opacity: 0; } }
}
</style>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
</body>
</html>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
</body>
</html>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</body>
</html>

<body>
<div class="gate" id="gate">
  <div class="gate-box">
    <span class="brand-mark" aria-hidden="true"></span>
    <h1>Zebra Mkt</h1>
    <p id="gate-msg">Cargando…</p>
    <button class="btn primary" id="gate-login" hidden>Entrar con Google</button>
    <button class="btn" id="gate-out" hidden>Usar otra cuenta</button>
  </div>
</div>
<div class="app">
  <aside class="side" aria-label="Menú">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span><div><b>Zebra Mkt</b><small>Zebra Club · Kosmos · Before · Zebra Beach</small></div></div>
    <nav class="nav" id="nav"></nav>

/* ===== fechas ===== */
const pad = (n) => String(n).padStart(2, '0');
const iso = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const HOY = iso(new Date());
const dia = (off) => { const d = new Date(); d.setDate(d.getDate() + off); return iso(d); };
const parse = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const diff = (s) => Math.round((parse(s) - parse(HOY)) / 86400000);
const DIAS = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const fCorta = (s) => { const d = parse(s); return DIAS[d.getDay()] + ' ' + d.getDate() + '/' + (d.getMonth() + 1); };
const cuando = (s) => { const n = diff(s); if (n === 0) return 'hoy'; if (n === 1) return 'mañana'; if (n === -1) return 'ayer'; if (n < 0) return 'hace ' + (-n) + ' días'; if (n < 7) return 'en ' + n + ' días'; return fCorta(s); };

const limpio = (o) => { const c = JSON.parse(JSON.stringify(o)); delete c.id; return c; };

/* Sube a Firestore lo que cambió en S respecto de lo último que llegó de la base. */
async function subirImagenes(t) {
  if (!t.imagenes || !t.imagenes.some((x) => typeof x === 'string' && x.startsWith('data:'))) return;
  const ids = [];
  for (const x of t.imagenes) {
    if (typeof x === 'string' && x.startsWith('data:')) {
      const ref = db.collection('imagenes').doc();
      await ref.set({ data: x, tarea: t.id, creado: firebase.firestore.FieldValue.serverTimestamp() });
      imgCache.set(ref.id, x); ids.push(ref.id);
    } else ids.push(x);
  }
  t.imagenes = ids;
}
async function guardar() {
  if (!db) return;
  try {
    for (const col of COLS) {
      const vivos = new Set();
      for (const o of S[col]) {
        if (!o.id) o.id = db.collection(col).doc().id;
        vivos.add(o.id);
        if (col === 'tareas') await subirImagenes(o);
        const j = JSON.stringify(limpio(o));
        if (ultimo[col].get(o.id) !== j) { ultimo[col].set(o.id, j); await db.collection(col).doc(o.id).set(JSON.parse(j)); }
      }
      for (const id of [...ultimo[col].keys()]) if (!vivos.has(id)) {
        ultimo[col].delete(id); await db.collection(col).doc(id).delete();
        if (col === 'tareas') { const qs = await db.collection('imagenes').where('tarea', '==', id).get(); qs.forEach((d) => d.ref.delete()); }
      }
    }
  } catch (e) { console.error(e); toast('No se pudo guardar: revisá la conexión'); }
}
function escuchar() {
  let pendientes = new Set(COLS);
  COLS.forEach((col) => db.collection(col).onSnapshot({ includeMetadataChanges: true }, (qs) => {
    const viejos = new Map(S[col].map((o) => [o.id, o]));
    const nuevos = [];
    qs.forEach((d) => {
      const data = d.data(); const j = JSON.stringify(data);
      ultimo[col].set(d.id, j);
      const o = viejos.get(d.id) || {};
      Object.keys(o).forEach((k) => { if (k !== 'id' && !(k in data)) delete o[k]; });
      Object.assign(o, data, { id: d.id }); nuevos.push(o);
    });
    for (const id of [...ultimo[col].keys()]) if (!nuevos.some((o) => o.id === id)) ultimo[col].delete(id);
    S[col] = nuevos;
    if (col === 'tareas') S.tareas.forEach((t) => { t.devoluciones = t.devoluciones || []; t.imagenes = t.imagenes || []; t.contenido = t.contenido || ''; t.referencias = t.referencias || ''; });
    pendientes.delete(col);
    const sync = document.getElementById('sync');
    if (sync) { const off = qs.metadata.hasPendingWrites || qs.metadata.fromCache; sync.classList.toggle('off', off); sync.lastChild.textContent = off ? 'Guardando…' : 'Sincronizado'; }
    if (!pendientes.size) { listo = true; render(); }
  }, (err) => { console.error(err); gate('No tenés permiso para ver estos datos. Pedile a Manu que agregue tu mail.', true); }));
}
async function cargarImagen(id) {
  if (imgCache.has(id)) return imgCache.get(id);
  const d = await db.collection('imagenes').doc(id).get();
  const v = d.exists ? d.data().data : ''; imgCache.set(id, v); return v;
}

/* ===== acceso ===== */
function gate(msg, conSalir) {

  $('#gate-login').hidden = !!conSalir; $('#gate-out').hidden = !conSalir;

function iniciar() {

  firebase.initializeApp(FIREBASE_CONFIG);

/* ===== ayudas ===== */
const $ = (sel, el = document) => el.querySelector(sel);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'value') el.value = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  kids.flat().forEach((c) => { if (c != null && c !== false) el.append(c.nodeType ? c : String(c)); });
  return el;
};
const yo = () => EQUIPO.find((p) => p.id === ui.yo) || { id: '', nombre: '', rol: '' };
const esAdmin = () => !!yo().admin;

const resps = (x) => (x.resps && x.resps.length ? x.resps : (x.resp ? [x.resp] : []));
const esDe = (x, id) => resps(x).includes(id);
const nombresResp = (x) => resps(x).map((id) => persona(id).nombre.split(' ')[0]).join(', ') || 'Sin asignar';
/* Pedidos + fechas del calendario que tienen responsables: todo cuenta como trabajo del equipo. */
function trabajos() {
  S.fechas.forEach((f) => {
    if (!Object.getOwnPropertyDescriptor(f, '_fecha')) {
      Object.defineProperty(f, '_fecha', { value: true, enumerable: false });
      Object.defineProperty(f, 'entrega', { get() { return this.fecha; }, enumerable: false, configurable: true });
      Object.defineProperty(f, 'publica', { get() { return this.tipo === 'Publicación' ? this.fecha : ''; }, enumerable: false, configurable: true });
    }
    if (!f.estado) f.estado = 'pedido';
  });
  return [...S.tareas, ...S.fechas.filter((f) => resps(f).length)];
}
const tipoTxt = (t) => t._fecha ? (t.tipo + ((t.formatos || []).length ? ' · ' + t.formatos.join(', ') : '')) : t.tipo;

/* ===== tarjeta de tarea ===== */
function siguiente(t) {

}
function puedeMover(t) { return esAdmin() || esDe(t, ui.yo); }

    h('div', { class: 'sheet-foot' }, h('div', { class: 'right' }, h('button', { class: 'btn', onclick: cerrarModal }, 'Cancelar'), h('button', { class: 'btn primary', onclick: () => {

      t.devoluciones = t.devoluciones || []; t.devoluciones.push({ autor: ui.yo, fecha: HOY, texto: txt }); t.estado = 'proceso'; guardar(); cerrarModal(); render(); toast('Devuelta a ' + nombresResp(t) + ' con los cambios');
    } }, 'Devolver'))));
}

function achicar(file) {
  return new Promise((ok, mal) => {
    const fr = new FileReader();
    fr.onload = () => { const img = new Image(); img.onload = () => {
      const k = Math.min(1, 900 / Math.max(img.width, img.height)); const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      ok(c.toDataURL('image/jpeg', 0.72)); }; img.onerror = mal; img.src = fr.result; };
    fr.onerror = mal; fr.readAsDataURL(file);
  });
}

function tarjeta(t, opts = {}) {

    h('div', { class: 'task-meta' }, marcaChip(t.marca), h('span', {}, tipoTxt(t)), t._fecha ? h('span', { class: 'pill p-muted' }, 'Calendario') : null, ent, t.publica ? h('span', {}, 'Publica ' + fCorta(t.publica)) : null, t.prioridad === 'Urgente' || t.prioridad === 'Alta' ? h('span', { class: 'pill ' + (t.prioridad === 'Urgente' ? 'p-bad' : 'p-warn') }, t.prioridad) : null),

    ultimaDevol(t) ? h('div', { class: 'devol' }, h('b', {}, 'Cambios pedidos por ' + persona(ultimaDevol(t).autor).nombre + ' · ' + cuando(ultimaDevol(t).fecha)), ultimaDevol(t).texto) : null,

      h('button', { class: 'btn small', onclick: (e) => { e.stopPropagation(); abrir(t); } }, puedeMover(t) ? 'Abrir' : 'Ver')));
  return card;
}

/* ===== vistas ===== */
function vistaMis() {
  const mias = trabajos().filter((t) => esDe(t, ui.yo));
  const activas = mias.filter((t) => !hecha(t)).sort((a, b) => a.entrega.localeCompare(b.entrega));
  const grupos = [
    { id: 'late', nombre: 'Vencidas', ts: activas.filter((t) => diff(t.entrega) < 0) },

function transcurrido(c) {

  return Math.min(1, Math.max(0.15, -diff(c.inicio) / total));
}
function estadoMetrica(mt, c) {

  if (!mt.valor) return { cls: 'p-muted', txt: 'sin dato', r: null };
  const r = mt.menorEsMejor ? mt.meta / mt.valor : mt.valor / mt.meta;
  const ritmo = mt.menorEsMejor ? r : r / transcurrido(c);
  const txt = Math.round(r * 100) + '%';
  return { cls: ritmo >= 0.95 ? 'p-ok' : ritmo >= 0.7 ? 'p-warn' : 'p-bad', txt, r, ritmo };
}
function semaforo(c) {

  if (!rs.length) return { cls: 'p-muted', txt: 'Faltan datos' };
  const peor = Math.min(...rs);
  if (peor >= 0.95 && gastoRitmo <= 1.15) return { cls: 'p-ok', txt: 'Bien' };
  if (peor >= 0.7) return { cls: 'p-warn', txt: 'Atención' };

}

async function duplicar(t) {
  let imgs = [];
  try { imgs = await Promise.all((t.imagenes || []).map((ref) => ref.startsWith('data:') ? ref : cargarImagen(ref))); } catch (e) { imgs = []; }
  const copia = JSON.parse(JSON.stringify(t));
  ['id', 'creado', 'link', 'devoluciones', 'horasReal'].forEach((k) => delete copia[k]);
  Object.assign(copia, { titulo: t.titulo + ' (copia)', estado: 'pedido', horasReal: 0, devoluciones: [], link: '', imagenes: imgs.filter(Boolean), pedidoPor: ui.yo });
  cerrarModal(); abrirTarea(null, copia); toast('Copia lista: cambiá lo que necesites y creala');
}

function abrirDia(s) {
  if (!esAdmin()) return;
  const antes = (() => { const d = parse(s); d.setDate(d.getDate() - 1); const r = iso(d); return r < HOY ? (s < HOY ? s : HOY) : r; })();
  modal(fCorta(s).replace(/^./, (c) => c.toUpperCase()), h('div', { style: 'display:grid;gap:10px' },
      h('button', { class: 'btn primary', style: 'justify-content:center;padding:12px', onclick: () => { cerrarModal(); abrirTarea(null, { publica: s, entrega: antes }); } }, 'Nuevo pedido para publicar este día'),
      h('button', { class: 'btn', style: 'justify-content:center;padding:12px', onclick: () => { cerrarModal(); abrirFecha(null, s); } }, 'Nueva fecha en el calendario (publicación, reunión, evento…)'),
      h('p', { style: 'margin:0;font-size:12px;color:var(--muted)' }, 'El pedido queda con fecha de publicación ' + fCorta(s) + ' y entrega ' + fCorta(antes) + '. Las dos se pueden cambiar.')),
    h('div', { class: 'sheet-foot' }, h('div', { class: 'right' }, h('button', { class: 'btn', onclick: cerrarModal }, 'Cancelar'))));
}

function selectorPersonas(inicial, soloLectura) {
  let elegidos = inicial.slice();
  const el = h('div', { class: 'toggles', role: 'group', 'aria-label': 'Responsables' });
  const pintar = () => el.replaceChildren(...[...EQUIPO, ...S.freelancers].map((p) => h('button', { type: 'button', 'aria-pressed': String(elegidos.includes(p.id)), disabled: soloLectura || null,
    title: p.rol || p.especialidad || '', onclick: () => { elegidos = elegidos.includes(p.id) ? elegidos.filter((y) => y !== p.id) : [...elegidos, p.id]; pintar(); } },
    p.nombre + (S.freelancers.includes(p) ? ' · free' : ''))));
  pintar();
  return { el, valor: () => elegidos.slice() };
}

function abrirTarea(t, base) {
  const nueva = !t;
  const admin = esAdmin();
  const propia = t && esDe(t, ui.yo);
  if (nueva && !admin) return;
  const x = t || { titulo: '', marca: ui.marca !== 'todas' ? ui.marca : 'zebra', tipo: 'Post', resp: '', estado: 'pedido', entrega: dia(3), prioridad: 'Normal', horasEst: 2, horasReal: 0, pedidoPor: ui.yo, brief: '', contenido: '', referencias: '', imagenes: [], devoluciones: [], link: '', publica: '', ...(base || {}) };
  let imagenes = (x.imagenes || []).slice();
  const soloLectura = !admin;
  const respSel = selectorPersonas(resps(x), soloLectura);
  const puedeEntregar = admin || propia;
  const estadosPermitidos = admin ? ESTADOS : ESTADOS.filter((e) => ['pedido', 'proceso', 'revision'].includes(e.id) || e.id === x.estado);
  const f = {
    titulo: h('input', { id: 'tt-titulo', value: x.titulo, placeholder: 'Ej. Flyer Halloween', readonly: soloLectura || null }),
    marca: sel('tt-marca', MARCAS.map((m) => [m.id, m.nombre]), x.marca, soloLectura),
    tipo: sel('tt-tipo', TIPOS.map((v) => [v, v]), x.tipo, soloLectura),
    estado: sel('tt-estado', estadosPermitidos.map((e) => [e.id, e.nombre]), x.estado, !puedeEntregar),
    entrega: h('input', { id: 'tt-entrega', type: 'date', value: x.entrega, readonly: soloLectura || null }),
    publica: h('input', { id: 'tt-publica', type: 'date', value: x.publica || '', readonly: soloLectura || null }),
    prioridad: sel('tt-prio', PRIORIDADES.map((v) => [v, v]), x.prioridad, soloLectura),
    horasEst: h('input', { id: 'tt-hest', type: 'number', min: '0', step: '0.5', value: x.horasEst, readonly: soloLectura || null }),
    horasReal: h('input', { id: 'tt-hreal', type: 'number', min: '0', step: '0.5', value: x.horasReal, readonly: !puedeEntregar || null }),
    contenido: h('textarea', { id: 'tt-contenido', placeholder: 'Todo lo que tiene que aparecer: textos, fecha y hora, line up, precios, dónde comprar…', readonly: soloLectura || null, style: 'min-height:110px' }, x.contenido || ''),
    referencias: h('textarea', { id: 'tt-refs', placeholder: 'Un link por línea (Pinterest, Instagram, Drive con fotos…)', readonly: soloLectura || null, style: 'min-height:60px' }, x.referencias || ''),
    brief: h('textarea', { id: 'tt-brief', placeholder: 'Estilo, medidas, formato, lo que haga falta aclarar…', readonly: soloLectura || null, style: 'min-height:60px' }, x.brief || ''),
    link: h('input', { id: 'tt-link', type: 'url', value: x.link, placeholder: 'https://drive.google.com/…', readonly: !puedeEntregar || null }),
  };
  const thumbs = h('div', { class: 'thumbs' });
  const pintarThumbs = () => {
    const kids = imagenes.map((ref, i) => {
      const img = h('img', { alt: 'Imagen de referencia ' + (i + 1) });
      const a = h('a', { target: '_blank', rel: 'noopener' }, img);
      const poner = (src) => { if (src) { img.src = src; a.href = src; } };
      if (ref.startsWith('data:')) poner(ref); else cargarImagen(ref).then(poner).catch(() => {});
      return h('div', { class: 'thumb' }, a, admin ? h('button', { 'aria-label': 'Quitar imagen', onclick: () => { imagenes.splice(i, 1); pintarThumbs(); } }, '×') : null);
    });
    if (admin) kids.push(h('label', { class: 'attach' }, '+ Imagen', h('input', { id: 'tt-img', type: 'file', accept: 'image/*', multiple: true, onchange: async (e) => {
      for (const file of [...e.target.files].slice(0, 6)) { try { imagenes.push(await achicar(file)); } catch (er) { toast('No se pudo leer ' + file.name); } }
      e.target.value = ''; pintarThumbs();
    } })));
    if (!kids.length) kids.push(h('span', { style: 'font-size:12px;color:var(--muted)' }, 'Sin imágenes'));
    thumbs.replaceChildren(...kids);
  };
  pintarThumbs();
  const refsLinks = (x.referencias || '').split(/\s+/).filter((u) => /^https?:\/\//.test(u));
  const hist = (x.devoluciones || []).length ? h('div', { class: 'full hist' }, h('label', { style: 'font-size:12px;color:var(--muted);font-weight:500' }, 'Devoluciones (' + x.devoluciones.length + ')'),
    ...x.devoluciones.slice().reverse().map((d) => h('div', { class: 'devol' }, h('b', {}, persona(d.autor).nombre + ' · ' + cuando(d.fecha)), d.texto))) : null;
  const seccion = (txt) => h('p', { class: 'full', style: 'margin:6px 0 0;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)' }, txt);
  const cuerpo = h('div', { class: 'form' },
    seccion('El pedido'),
    campo('Qué hay que hacer', f.titulo, true), campo('Marca', f.marca), campo('Tipo', f.tipo),
    h('div', { class: 'field full' }, h('label', {}, 'Responsables (podés marcar más de uno)'), respSel.el), campo('Fecha de entrega', f.entrega), campo('Fecha de publicación', f.publica), campo('Prioridad', f.prioridad),
    campo('Contenido que tiene que ir', f.contenido, true),
    seccion('Referencias'),
    campo('Links de referencia', f.referencias, true),
    soloLectura && refsLinks.length ? h('div', { class: 'full refs' }, ...refsLinks.map((u) => h('a', { href: u, target: '_blank', rel: 'noopener' }, u + ' ↗'))) : null,
    h('div', { class: 'field full' }, h('label', { for: 'tt-img' }, 'Imágenes de referencia'), thumbs),
    campo('Notas para quien lo hace', f.brief, true),
    seccion('Entrega'),
    campo('Link del entregable (Drive)', f.link, true),
    t && x.link ? h('a', { class: 'full link-out', href: x.link, target: '_blank', rel: 'noopener' }, 'Abrir el entregable ↗') : null,
    campo('Estado', f.estado), h('div', { class: 'form', style: 'grid-template-columns:1fr 1fr;gap:12px' }, campo('Horas estimadas', f.horasEst), campo('Horas reales', f.horasReal)),
    hist,
    t ? h('p', { class: 'full', style: 'margin:0;font-size:12px;color:var(--muted)' }, 'Pedido por ' + (persona(x.pedidoPor).nombre || '—')) : null,
    !admin && !propia ? h('p', { class: 'full warnbox', style: 'color:var(--muted);background:var(--surface-2)' }, 'Esta tarea es de ' + nombresResp(x) + '. Solo la puede editar esa persona o quien asigna tareas.') : null);
  const guardarTarea = () => {
    if (admin) {
      const titulo = f.titulo.value.trim(); if (!titulo) { toast('Poné qué hay que hacer'); f.titulo.focus(); return; }
      if (!respSel.valor().length) { toast('Elegí al menos un responsable'); return; }
      Object.assign(x, { titulo, marca: f.marca.value, tipo: f.tipo.value, resps: respSel.valor(), resp: respSel.valor()[0], entrega: f.entrega.value || dia(3), publica: f.publica.value || '', prioridad: f.prioridad.value, horasEst: Number(f.horasEst.value) || 0,
        contenido: f.contenido.value, referencias: f.referencias.value.trim(), brief: f.brief.value, imagenes });
    }
    if (puedeEntregar) {
      const link = f.link.value.trim();
      if (f.estado.value === 'revision' && x.estado !== 'revision' && !link) { toast('Pegá el link del Drive para mandarla a revisión'); f.link.focus(); return; }
      Object.assign(x, { estado: f.estado.value, horasReal: Number(f.horasReal.value) || 0, link });
    }
    if (nueva) { x.id = uid(); x.creado = HOY; S.tareas.push(x); }
    guardar(); cerrarModal(); render(); toast(nueva ? 'Tarea creada y asignada a ' + nombresResp(x) : 'Tarea guardada');
  };
  const pie = h('div', { class: 'sheet-foot' },
    t && admin ? botonPeligro('Eliminar tarea', () => { S.tareas = S.tareas.filter((y) => y !== t); guardar(); cerrarModal(); render(); toast('Tarea eliminada'); }) : null,
    h('div', { class: 'right' },
      t && admin ? h('button', { class: 'btn', onclick: () => duplicar(t) }, 'Duplicar') : null,
      t && admin && x.estado === 'revision' ? h('button', { class: 'btn', onclick: () => { cerrarModal(); devolver(t); } }, 'Devolver con cambios') : null,
      h('button', { class: 'btn', onclick: cerrarModal }, puedeEntregar ? 'Cancelar' : 'Cerrar'),
      puedeEntregar ? h('button', { class: 'btn primary', onclick: guardarTarea }, nueva ? 'Crear tarea' : 'Guardar') : null));
  modal(nueva ? 'Nuevo pedido' : (puedeEntregar ? 'Editar tarea' : 'Tarea'), cuerpo, pie);
}

const FORMATOS = ['Historia', 'Post', 'Carrusel', 'Reel', 'Pauta'];
function abrirFecha(fe, fechaInicial) {
  const admin = esAdmin();
  const x = fe || { titulo: '', tipo: 'Publicación', formatos: [], marca: 'zebra', fecha: fechaInicial || dia(1), hora: '', notas: '', resps: [], estado: 'pedido' };
  let formatos = (x.formatos || []).slice();
  const mia = fe && esDe(fe, ui.yo);
  const respSel = selectorPersonas(resps(x), !admin);
  const estadoSel = sel('fe-estado', ESTADOS.map((e) => [e.id, e.nombre]), x.estado || 'pedido', !(admin || mia));
  const hEst = h('input', { id: 'fe-hest', type: 'number', min: '0', step: '0.5', value: x.horasEst || '', readonly: !admin || null });
  const hReal = h('input', { id: 'fe-hreal', type: 'number', min: '0', step: '0.5', value: x.horasReal || '', readonly: !(admin || mia) || null });
  const f = {
    titulo: h('input', { id: 'fe-titulo', value: x.titulo, placeholder: 'Ej. Anuncio line up Halloween', readonly: !admin || null }),
    tipo: sel('fe-tipo', [['Publicación', 'Publicación'], ['Reunión', 'Reunión'], ['Evento', 'Evento'], ['Sesión de fotos', 'Sesión de fotos'], ['Otro', 'Otro']], x.tipo, !admin),
    marca: sel('fe-marca', [['general', 'General'], ...MARCAS.map((m) => [m.id, m.nombre])], x.marca, !admin),
    fecha: h('input', { id: 'fe-fecha', type: 'date', value: x.fecha, readonly: !admin || null }),
    hora: h('input', { id: 'fe-hora', type: 'time', value: x.hora, readonly: !admin || null }),
    notas: h('textarea', { id: 'fe-notas', placeholder: 'Lugar, link, quiénes van, qué se publica…', readonly: !admin || null }, x.notas),
  };
  const toggles = h('div', { class: 'toggles', role: 'group', 'aria-label': 'Formatos' });
  const pintarToggles = () => toggles.replaceChildren(...FORMATOS.map((fm) => h('button', { type: 'button', 'aria-pressed': String(formatos.includes(fm)), disabled: !admin || null,
    onclick: () => { formatos = formatos.includes(fm) ? formatos.filter((y) => y !== fm) : [...formatos, fm]; pintarToggles(); } }, fm)));
  pintarToggles();
  const pie = h('div', { class: 'sheet-foot' },
    fe && admin ? botonPeligro('Eliminar fecha', () => { S.fechas = S.fechas.filter((y) => y !== fe); guardar(); cerrarModal(); render(); toast('Fecha eliminada'); }) : null,
    h('div', { class: 'right' }, h('button', { class: 'btn', onclick: cerrarModal }, admin || mia ? 'Cancelar' : 'Cerrar'), admin || mia ? h('button', { class: 'btn primary', onclick: () => {
      if (!admin) { x.estado = estadoSel.value; x.horasReal = Number(hReal.value) || 0; guardar(); cerrarModal(); render(); toast('Estado actualizado'); return; }
      const titulo = f.titulo.value.trim(); if (!titulo) { toast('Poné un título'); return; }
      Object.assign(x, { titulo, tipo: f.tipo.value, formatos, marca: f.marca.value, fecha: f.fecha.value || HOY, hora: f.hora.value, notas: f.notas.value, resps: respSel.valor(), estado: estadoSel.value, horasEst: Number(hEst.value) || 0, horasReal: Number(hReal.value) || 0 });
      if (!fe) { x.id = uid(); S.fechas.push(x); }
      guardar(); cerrarModal(); render(); toast(fe ? 'Fecha guardada' : 'Fecha agregada');
    } }, fe ? 'Guardar' : 'Agregar fecha') : null));
  modal(fe ? (admin ? 'Editar fecha' : x.titulo) : 'Nueva fecha', h('div', { class: 'form' }, campo('Título', f.titulo, true), campo('Tipo', f.tipo), campo('Marca', f.marca),
    h('div', { class: 'field full' }, h('label', {}, 'Formato (marcá todos los que van)'), toggles),
    campo('Fecha', f.fecha), campo('Hora', f.hora),
    h('div', { class: 'field full' }, h('label', {}, 'Responsables'), respSel.el),
    campo('Estado', estadoSel), h('div', { class: 'form', style: 'grid-template-columns:1fr 1fr;gap:12px' }, campo('Horas estimadas', hEst), campo('Horas reales', hReal)), campo('Notas', f.notas, true)), pie);
}

function abrirCampania(c) {
  const x = c || { nombre: '', marca: 'zebra', plataforma: 'Meta', inicio: HOY, fin: dia(14), presupuesto: 0, invertido: 0, objetivo: '', metricas: [], actualizado: '' };
  const f = {
    nombre: h('input', { id: 'c-nombre', value: x.nombre, placeholder: 'Ej. Preventa Halloween' }),
    marca: sel('c-marca', MARCAS.map((m) => [m.id, m.nombre]), x.marca),
    plataforma: sel('c-plat', [['Meta', 'Meta (Instagram / Facebook)'], ['TikTok', 'TikTok'], ['Google', 'Google'], ['Otra', 'Otra']], x.plataforma),
    inicio: h('input', { id: 'c-ini', type: 'date', value: x.inicio }), fin: h('input', { id: 'c-fin', type: 'date', value: x.fin }),
    presupuesto: h('input', { id: 'c-pres', type: 'number', min: '0', value: x.presupuesto || '' }),
    objetivo: h('input', { id: 'c-obj', value: x.objetivo, placeholder: 'Ej. Vender entradas de preventa' }),
  };
  modal('Nueva campaña', h('div', { class: 'form' }, campo('Nombre', f.nombre, true), campo('Marca', f.marca), campo('Plataforma', f.plataforma), campo('Inicio', f.inicio), campo('Fin', f.fin), campo('Presupuesto ($)', f.presupuesto), campo('Objetivo', f.objetivo), h('p', { class: 'full', style: 'margin:0;font-size:12px;color:var(--muted)' }, 'Después de crearla, pedile a Santi los datos que necesites desde la tarjeta de la campaña.')),
    h('div', { class: 'sheet-foot' }, h('div', { class: 'right' }, h('button', { class: 'btn', onclick: cerrarModal }, 'Cancelar'), h('button', { class: 'btn primary', onclick: () => {
      const nombre = f.nombre.value.trim(); if (!nombre) { toast('Poné un nombre'); return; }
      Object.assign(x, { id: uid(), nombre, marca: f.marca.value, plataforma: f.plataforma.value, inicio: f.inicio.value || HOY, fin: f.fin.value || dia(14), presupuesto: Number(f.presupuesto.value) || 0, objetivo: f.objetivo.value.trim() });
      S.campanias.unshift(x); guardar(); cerrarModal(); render(); toast('Campaña creada');
    } }, 'Crear campaña'))));
}

function abrirInversion(c) {
  const inp = h('input', { id: 'inv-v', type: 'number', min: '0', value: c.invertido || '' });
  modal('Inversión · ' + c.nombre, h('div', { class: 'form' }, campo('Total invertido hasta hoy ($)', inp, true), h('p', { class: 'full', style: 'margin:0;font-size:12px;color:var(--muted)' }, 'Presupuesto: ' + ars(c.presupuesto))),
    h('div', { class: 'sheet-foot' }, h('div', { class: 'right' }, h('button', { class: 'btn', onclick: cerrarModal }, 'Cancelar'), h('button', { class: 'btn primary', onclick: () => { c.invertido = Number(inp.value) || 0; c.actualizado = HOY; guardar(); cerrarModal(); render(); toast('Inversión actualizada'); } }, 'Guardar'))));
}

function abrirFreelancer(fr) {
  const x = fr || { nombre: '', especialidad: 'Edición de video', tarifa: 0, unidad: 'por pieza', contacto: '' };
  const f = {
    nombre: h('input', { id: 'fr-nombre', value: x.nombre }),
    esp: sel('fr-esp', ['Edición de video', 'Fotografía', 'Filmmaker', 'Diseño', 'Creador/a de contenido', 'Otro'].map((v) => [v, v]), x.especialidad),
    tarifa: h('input', { id: 'fr-tarifa', type: 'number', min: '0', value: x.tarifa || '' }),
    unidad: sel('fr-unidad', [['por pieza', 'por pieza'], ['por noche', 'por noche'], ['por hora', 'por hora'], ['por mes', 'por mes']], x.unidad),
    contacto: h('input', { id: 'fr-contacto', value: x.contacto, placeholder: 'WhatsApp o Instagram' }),
  };
  const asignadas = fr ? trabajos().filter((t) => esDe(t, fr.id) && !hecha(t)).length : 0;
  modal(fr ? 'Editar freelancer' : 'Nuevo freelancer', h('div', { class: 'form' }, campo('Nombre', f.nombre, true), campo('Especialidad', f.esp), campo('Contacto', f.contacto), campo('Tarifa ($)', f.tarifa), campo('Unidad', f.unidad)),
    h('div', { class: 'sheet-foot' },
      fr ? (asignadas ? h('span', { class: 'warnbox' }, 'Tiene ' + asignadas + ' tareas activas: reasignalas antes de quitarlo.') : botonPeligro('Quitar freelancer', () => { S.freelancers = S.freelancers.filter((y) => y !== fr); guardar(); cerrarModal(); render(); toast('Freelancer quitado'); })) : null,
      h('div', { class: 'right' }, h('button', { class: 'btn', onclick: cerrarModal }, 'Cancelar'), h('button', { class: 'btn primary', onclick: () => {
        const nombre = f.nombre.value.trim(); if (!nombre) { toast('Poné un nombre'); return; }
        Object.assign(x, { nombre, especialidad: f.esp.value, tarifa: Number(f.tarifa.value) || 0, unidad: f.unidad.value, contacto: f.contacto.value.trim() });
        if (!fr) { x.id = 'free-' + uid(); S.freelancers.push(x); }
        guardar(); cerrarModal(); render(); toast(fr ? 'Freelancer guardado' : 'Freelancer agregado');
      } }, fr ? 'Guardar' : 'Agregar'))));
}

/* ===== render ===== */
function render() {
  pintarNav();
  const v = { mis: vistaMis, tablero: vistaTablero, calendario: vistaCalendario, carga: vistaCarga, pauta: vistaPauta, equipo: vistaEquipo }[ui.vista] || vistaMis;
  $('#view').replaceChildren(listo ? v() : h('div', { class: 'empty', style: 'margin-top:40px' }, 'Cargando datos del equipo…'));
}
iniciar();
</script>
